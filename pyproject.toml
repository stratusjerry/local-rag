[project]
name = "local-rag"
version = "0.1.0"
description = "A fully local Retrieval-Augmented Generation system"
requires-python = ">=3.13"
dependencies = [
    "chromadb>=0.4.22",
    "ollama>=0.4.0",
    "openai>=1.12.0",
    "boto3>=1.34.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "olefile>=0.47",
    "sentence-transformers>=2.2.2",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.27.0",
    "audioop-lts>=0.2.1",
]

[dependency-groups]
ui = ["streamlit>=1.30.0"]
openwebui = ["open-webui"]
dev = ["pytest>=7.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I"]
